name: Feature request
description: Propose a focused improvement to a XIYO project
title: "[Feature]: "
body:
  - type: input
    id: project
    attributes:
      label: Project or plugin
      placeholder: message-pipeline
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what a successful result would let the user do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note existing workflows or tools you tried.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include credentials, personal data, or private source content.
          required: true
