name: Bug report
description: Report a reproducible problem in a XIYO project
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Remove credentials and personal data before submitting.
  - type: input
    id: project
    attributes:
      label: Project or plugin
      description: Name the affected repository, plugin, or executable.
      placeholder: apple-calendar / calctl
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Include the plugin, package, or commit version when available.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex
        - Claude Code
        - Standalone CLI
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system version, architecture, and installation method.
      placeholder: macOS 26, Apple silicon, GitHub marketplace
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest sequence that reproduces the problem using synthetic data.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: >-
        Paste only the relevant, redacted output. Do not include source messages,
        calendar contents, credentials, account identifiers, or local paths.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, private content, and stable identifiers.
          required: true
        - label: This is not a security vulnerability.
          required: true
